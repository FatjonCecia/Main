<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .red-square{
      display: inline-block;
      background-color: red;
      height: 300px;
      width: 300px;
    }
    .green-circle{
      display: inline-block;
      background-color: green;
      height: 300px;
      width: 300px;
      border-radius: 300px;
    }
    .service{
      display:inline-block;
      border-color: rgb(190, 25, 25);
      padding: 10px 10px;
      border-style: dashed;
    }
  </style>
</head>
<body>
  <div class="red-square"></div>
  <div class="green-circle"></div>
  <div class="service">
    <p>Satisfied with our service?</p>
    <p><button>Yes</button><span> </span><button>No</button></p>
  </div>
</body>
</html>
