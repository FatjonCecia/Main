<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      
     border: none;
     padding-bottom: 5px;
     
     box-shadow: 2px 2px 20px  rgba(61, 60, 60, 0.2);
     margin-right: 10px;
    }
    .image{
      object-fit: cover;
      object-position: center;
      width: 100%;
      height: 200px;
    }
    .name{
      font-weight: bold;
      font-family:arial;
      
      margin-left: 5px;
    }
    .mutuals{
      margin-left: 5px;
      opacity: 0.7;
      font-family:arial;
font-size: 14px;
    }
    .button{
      padding: 10px 17px;
      background-color: rgb(86, 86, 230);
      color: white;
      font-family: arial;
      border: none;
      border-radius: 4px;
      margin-left: 5px;
      cursor: pointer;
    }
    .button:hover{
      background-color: aquamarine;
      color: red;
    }
    .grid{
      display: grid;
      grid-template-columns: 200px 200px 200px;
      align-items: center;
      column-gap: 20px;
    }
  </style>
</head>
<body>
  <div class="grid">
  <div class="container">
    <img src="Gragas_2.webp" alt="" class="image">
    <p class="name">Gragas</p>
    <p class="mutuals">2 mutual friends</p>
    <button class="button">Add Friend</button>
  </div>
  <div class="container">
    <img src="wp3104243.webp" alt="" class="image">
    <p class="name">Malphite</p>
    <p class="mutuals">1 mutual friends</p>
    <button class="button">Add Friend</button>
  </div>
  <div class="container">
    <img src="Draven_2.webp" alt="" class="image">
    <p class="name">Draven</p>
    <p class="mutuals">0 mutual friends</p>
    <button class="button">Add Friend</button>
  </div>
  </div>
</body>
</html>
