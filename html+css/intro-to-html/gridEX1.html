<!DOCTYPE html>
<html lang="en">
<head>

  <title>Document</title>
  <style>
    .grid{
      
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      column-gap: 25px;
      row-gap: 10px;
    }
    .div1{
      background-color: aqua;
    }
    .div2{
      background-color: blueviolet;
    }
  </style>
</head>
<body>
  <div class="grid">
  <div class="div1">div1</div>
  <div class="div2">div2</div>
  <div class="div1">div1</div>
  <div class="div2">div2</div>
  


    <div class="div1">div1</div>

</body>
